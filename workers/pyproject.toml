[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "photoeditor-workers"
version = "1.0.0.dev0"
requires-python = ">=3.11,<3.12"
dependencies = [
  "numpy>=1.26,<3", "scipy>=1.13,<2", "pydantic>=2.10,<3",
  "rfc8785==0.1.4", "jsonschema>=4.23,<5", "pika>=1.3,<2",
  "psycopg[binary]>=3.2,<4", "minio>=7.2,<8", "Pillow>=11,<13",
  "opencv-python-headless>=4.10,<5", "tifffile>=2024.8",
  "typer>=0.15,<1", "psutil>=6,<8", "scikit-image>=0.24,<1"
]
[project.optional-dependencies]
ml = ["torch>=2.6,<3", "torchvision>=0.21,<1", "transformers>=4.49,<5", "diffusers>=0.32,<1", "accelerate>=1,<2", "safetensors>=0.5,<1", "huggingface-hub>=0.28,<1"]
media = ["pyvips[binary]>=3.1,<4", "rawpy>=0.24,<1", "pymatting>=1.1,<2", "onnxruntime>=1.20,<2"]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
photo-worker = "photo_worker.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["photo_worker"]

[tool.pytest.ini_options]
testpaths = ["../tests/platform"]
pythonpath = ["."]
