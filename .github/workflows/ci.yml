name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  skips:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check-skips.py
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
      - run: go -C backend vet ./...
      - run: go -C backend test ./...
  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --project workers --extra dev --python 3.11
      - run: uv run --project workers python -m pytest workers/tests -q -p no:cacheprovider
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cd apps/portal && npm ci && npm test -- --run && npm run build
      - run: cd apps/photographer && npm ci && npm test -- --run && npm run typecheck
