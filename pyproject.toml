[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "photoeditor"
version = "0.3.3"
description = "Local, reproducible full-resolution portrait batch processing"
requires-python = ">=3.10,<3.13"
dependencies = ["numpy>=1.26,<2", "opencv-contrib-python>=4.10,<4.12", "Pillow>=11,<13", "scipy>=1.13,<2", "pydantic>=2.10,<3", "PyYAML>=6,<7", "tifffile>=2024.8", "imagecodecs>=2024.6", "mediapipe==0.10.21"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
studio = ["PySide6==6.11.2"]

[project.scripts]
photoeditor = "photoeditor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
