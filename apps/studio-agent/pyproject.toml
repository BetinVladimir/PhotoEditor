[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "photoeditor-studio-agent"
version = "0.1.0"
requires-python = ">=3.10,<3.13"
dependencies = ["cryptography>=43,<47", "keyring>=25,<26"]

[project.scripts]
photo-studio-agent = "studio_agent.cli:main"

[tool.setuptools.packages.find]
include = ["studio_agent*"]
